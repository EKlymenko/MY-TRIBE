name: Site asset preparation
on:
  push:
    paths:
      - '.github/workflows/site-assets.yml'
      - 'scripts/**'
      - 'site-source/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4 playwright
      - run: python scripts/build.py
      - run: python -m playwright install --with-deps chromium
      - run: |
          mkdir -p checks
          python -m http.server 8000 > /tmp/site-server.log 2>&1 &
          python scripts/check.py
      - uses: actions/upload-artifact@v4
        with:
          name: site-desktop-mobile-checks
          path: checks/
      - name: Save checked website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html my-tribe Jane_My_Tribe_Stage_1.html assets checks/results.json
          git diff --cached --quiet || git commit -m "Restore approved My Tribe page and verified standalone export"
          git push
